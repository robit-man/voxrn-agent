name: Contract and runtime conformance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt 'jsonschema[format-nongpl]==4.26.0'
          if [[ -f contracts/asyncapi.json ]] && { ! command -v ffmpeg || ! command -v ffprobe; } >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('scripts/generate_clients.py', 'clients/**') != ''
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - name: Install the pinned TypeScript compiler
        if: hashFiles('scripts/generate_clients.py', 'clients/**') != ''
        run: npm install --global --ignore-scripts typescript@5.9.3
      - name: Verify canonical contracts, generated artifacts and compatibility
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$CONTRACT_BASE" == "0000000000000000000000000000000000000000" ]]; then
            python -B scripts/check_contracts.py
          else
            [[ "$CONTRACT_BASE" =~ ^[a-f0-9]{40}$ ]]
            python -B scripts/check_contracts.py --base "$CONTRACT_BASE"
          fi
      - name: Check TypeScript client
        if: hashFiles('scripts/generate_clients.py', 'clients/**') != ''
        run: tsc -p clients/typescript/tsconfig.json
      - name: Run the isolated runtime tests
        run: python -B -m unittest discover -s tests -v
